<div class="fx" data-fx>
  <button type="button" class="fx__open osd" aria-expanded="false" aria-controls="fx-panel">Menu</button>
  <div class="fx__panel osd" id="fx-panel" hidden>
    <p class="fx__title">Picture settings</p>
    <button type="button" class="fx__row" data-fx-level-btn aria-label="Effect intensity"><span>Intensity</span><span class="fx__level"></span></button>
    <button type="button" class="fx__row" role="switch" aria-checked="true" data-fx-key="split"><span>Color split</span><span class="fx__val"></span></button>
    <button type="button" class="fx__row" role="switch" aria-checked="true" data-fx-key="tape"><span>Tape</span><span class="fx__val"></span></button>
    <button type="button" class="fx__row" role="switch" aria-checked="true" data-fx-key="tracking"><span>Tracking</span><span class="fx__val"></span></button>
    <button type="button" class="fx__row" role="switch" aria-checked="true" data-fx-key="scan"><span>Scanlines</span><span class="fx__val"></span></button>
    <button type="button" class="fx__row" role="switch" aria-checked="true" data-fx-key="motion"><span>Motion</span><span class="fx__val"></span></button>
    <button type="button" class="fx__close" data-fx-close>Exit</button>
  </div>
</div>
