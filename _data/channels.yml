# Portfolio channels. A project's `channel` must match one of these ids.
# Change names/colors here and the filter tiles, chips and cards update everywhere.
#
# Each channel can have its own animation ("ident") that you make yourself:
#   ident:        /idents/games.mp4      video loop (.mp4/.webm), animated .gif/.webp, or a still image
#   ident_poster: /idents/games.jpg      optional still frame for videos (shown while loading / when Motion is off)
#   ident_mode:   loop                   loop = plays while on screen; scroll = video scrubs as you scroll
# Put the files in an /idents/ folder. Wide (16:9) works best; keep loops short and small (under ~2 MB).
