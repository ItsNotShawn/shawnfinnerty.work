<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- if page.seo_title %}
  <title>{{ page.seo_title }}</title>
  {%- elsif page.title %}
  <title>{{ page.title }} | {{ site.title }}</title>
  {%- else %}
  <title>{{ site.title }}</title>
  {%- endif %}
  <meta name="description" content="{{ page.description | default: page.summary | default: site.description | strip_html | strip_newlines | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.seo_title | default: page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: page.summary | default: site.description | strip_html | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="theme-color" content="{% if page.theme == 'label' %}#fbfbf8{% else %}#000000{% endif %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Righteous&family=VT323&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body class="theme-{{ page.theme | default: 'screen' }}{% if page.body_class %} {{ page.body_class }}{% endif %}">
  <a class="skip" href="#main">Skip to content</a>
{{ content }}
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
